<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Curhat 📝</title>

<style>
body{
  margin:0;
  font-family:Arial;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  overflow:hidden;

  background:linear-gradient(135deg,#bcdcff,#ffd6e7,#e6dcff);
}

/* ✨ LAYER GLOW */
body::before{
  content:"";
  position:absolute;
  width:320px;
  height:320px;
  background:#ffffff;
  opacity:0.25;
  filter:blur(90px);
  border-radius:50%;
  top:10%;
  left:10%;
}

body::after{
  content:"";
  position:absolute;
  width:350px;
  height:350px;
  background:#ffb6d9;
  opacity:0.25;
  filter:blur(100px);
  border-radius:50%;
  bottom:10%;
  right:10%;
}

/* 🌐 NAVBAR GLASS */
.nav{
  position:fixed;
  top:12px;
  left:50%;
  transform:translateX(-50%);
  background:rgba(255,255,255,0.6);
  backdrop-filter: blur(12px);
  padding:8px 14px;
  border-radius:14px;
  display:flex;
  gap:18px;
  box-shadow:0 8px 20px rgba(0,0,0,0.08);
  font-size:14px;
  z-index:999;
}

.nav a{
  text-decoration:none;
  color:#2c3e50;
}

.nav a:hover{
  color:#4a6fa5;
}

/* 💌 CARD GLASS */
.card{
  background:rgba(255,255,255,0.7);
  backdrop-filter: blur(12px);
  padding:25px;
  border-radius:18px;
  width:340px;
  text-align:center;
  box-shadow:0 10px 30px rgba(0,0,0,0.08);
  z-index:1;
}

textarea{
  width:100%;
  height:120px;
  padding:10px;
  border-radius:10px;
  border:1px solid #ddd;
  outline:none;
  background:rgba(255,255,255,0.8);
}

button{
  margin-top:10px;
  padding:10px;
  border:none;
  border-radius:10px;
  background:#4a6fa5;
  color:white;
  cursor:pointer;
  transition:0.2s;
}

button:hover{
  transform:scale(1.05);
}

/* 💖 RESULT */
.kode{
  margin-top:12px;
  font-size:13px;
  line-height:1.6;
  color:#333;
}

.kode-box{
  background:rgba(255,255,255,0.7);
  padding:10px;
  border-radius:10px;
  font-weight:bold;
  letter-spacing:1px;
  margin-top:8px;
  backdrop-filter: blur(8px);
}
</style>
</head>

<body>

<!-- 🌐 NAVBAR -->
<div class="nav">
  <a href="index.html">🏠 Home</a>
  <a href="curhat.html">💌 Curhat</a>
  <a href="cek.html">💬 Cek</a>
  <a href="dashboard.html">🧑‍💻 Admin</a>
</div>

<!-- 💌 CARD -->
<div class="card">
  <h3>💌 Tulis Curhat</h3>

  <textarea id="curhat" placeholder="tulis isi hati..."></textarea>

  <button onclick="kirimCurhat()">kirim</button>

  <p id="hasil" class="kode"></p>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDzPenfYo2",
  authDomain: "dear-girletterz-a2c37.firebaseapp.com",
  projectId: "dear-girletterz-a2c37"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

window.kirimCurhat = async function(){
  let isi = document.getElementById("curhat").value;
  if(!isi) return;

  let kode = "GLTZ-" + Math.floor(1000 + Math.random()*9000);

  await setDoc(doc(db,"curhat",kode),{
    isi:isi,
    balasan:"",
    tanggal:new Date()
  });

  document.getElementById("hasil").innerHTML = `
    💖 terkirim!<br>

    <div class="kode-box">
      ${kode}
    </div>

    <button onclick="copyKode('${kode}')">copy kode</button>
  `;

  document.getElementById("curhat").value="";
}

/* ✨ MODERN COPY (REPLACE yang lama) */
window.copyKode = async function(kode){
  try{
    await navigator.clipboard.writeText(kode);
    alert("kode tersalin 💖");
  }catch(e){
    alert("gagal copy 😭");
  }
}
</script>

</body>
</html>
