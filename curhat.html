<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Curhat 📝</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:linear-gradient(135deg,#eaf2ff,#f7f7fb,#ffeef3);
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
}

.card{
  background:white;
  padding:25px;
  border-radius:15px;
  width:340px;
  text-align:center;
  box-shadow:0 10px 25px rgba(0,0,0,0.08);
}

textarea{
  width:100%;
  height:120px;
  padding:10px;
  border-radius:10px;
  border:1px solid #ddd;
}

button{
  margin-top:10px;
  padding:10px;
  border:none;
  border-radius:10px;
  background:#4a6fa5;
  color:white;
  cursor:pointer;
}

.kode{
  margin-top:10px;
  font-size:13px;
}
</style>
</head>

<body>

<div class="card">
  <h3>💌 Tulis Curhat</h3>

  <textarea id="curhat" placeholder="keluarin semuanya lewat tulisan aja, fighting! ^O^"></textarea>

  <button onclick="kirimCurhat()">kirim</button>

  <p id="hasil" class="kode"></p>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDzPenfYo2c7Q6UNin895TuZhuCj4qWE0k",
  authDomain: "dear-girletterz-a2c37.firebaseapp.com",
  projectId: "dear-girletterz-a2c37",
  storageBucket: "dear-girletterz-a2c7.firebasestorage.app",
  messagingSenderId: "1023676296781",
  appId: "1:1023676296781:web:c31b2ddfe4ce1675c9f604"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

window.kirimCurhat = async function(){
  let isi = document.getElementById("curhat").value;
  if(!isi) return;

  let kode = "GLTZ-" + Math.floor(1000 + Math.random()*9000);

  await setDoc(doc(db,"curhat",kode),{
    isi:isi,
    balasan:"",
    tanggal:new Date()
  });

  document.getElementById("hasil").innerHTML = `
    💖 terkirim!<br>
    kode kamu: <b>${kode}</b>
    <br><br>
    <button onclick="copyKode('${kode}')">copy kode</button>
  `;

  document.getElementById("curhat").value="";
}

window.copyKode = function(kode){
  const temp = document.createElement("input");
  document.body.appendChild(temp);
  temp.value = kode;
  temp.select();
  document.execCommand("copy");
  document.body.removeChild(temp);
  alert("kode tersalin 💖");
}
</script>

</body>
</html>
