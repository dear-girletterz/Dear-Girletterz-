<!DOCTYPE html>

<html lang="id">
<head>

align-items:center;

.card{

p{

color:#555;
}

.btn{

margin:10px;
padding:14px 22px;
border-radius:999px;

background:#ff89b5;

.btn:hover{

}

<body>

<div class="card">

<h1>💌 Dear Glitz</h1>

<p>
