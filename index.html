<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Curhat Space</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #eaf2ff, #f7f7fb, #ffeef3);
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
}

.card {
  background: rgba(255,255,255,0.92);
  padding: 28px;
  border-radius: 18px;
  width: 340px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.08);
  text-align: center;
  backdrop-filter: blur(6px);
}

h2 {
  font-size: 20px;
  color: #2c3e50;
  margin-bottom: 10px;
}

p.subtitle {
  font-size: 12px;
  color: #666;
  margin-bottom: 15px;
}

textarea {
  width: 100%;
  height: 130px;
  border-radius: 12px;
  border: 1px solid #ddd;
  padding: 10px;
  resize: none;
  outline: none;
  font-size: 13px;
}

button {
  margin-top: 12px;
  padding: 10px 16px;
  border: none;
  border-radius: 10px;
  background: #4a6fa5;
  color: white;
  cursor: pointer;
  font-size: 13px;
}

button:hover {
  background: #3f5f8f;
}

.kode {
  margin-top: 12px;
  font-size: 12px;
  color: #444;
}
</style>
</head>

<body>

<div class="card">
  <h2>Curhat Space</h2>
  <p class="subtitle">tempat cerita tanpa di-judge 🌿</p>

  <textarea id="curhat" placeholder="tulis apa yang lagi kamu pikirin..."></textarea>

  <button onclick="kirimCurhat()">kirim</button>

  <p class="kode" id="hasil"></p>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDzPenfYo2c7Q6UNin895TuZhuCj4qWE0k",
  authDomain: "dear-girletterz-a2c37.firebaseapp.com",
  projectId: "dear-girletterz-a2c37",
  storageBucket: "dear-girletterz-a2c37.firebasestorage.app",
  messagingSenderId: "1023676296781",
  appId: "1:1023676296781:web:c31b2ddfe4ce1675c9f604"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

window.kirimCurhat = async function () {
  let isi = document.getElementById("curhat").value;

  if (!isi) return;

  let kode = "GLTZ-" + Math.floor(1000 + Math.random() * 9000);

  await setDoc(doc(db, "curhat", kode), {
    isi: isi,
    balasan: "",
    tanggal: new Date()
  });

  document.getElementById("hasil").innerText =
    "terkirim ✓ kode: " + kode;

  document.getElementById("curhat").value = "";
}
</script>

</body>
</html>
