<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Dear, Girletterz 💌</title>

<style>
body{
  margin:0;
  font-family:Arial;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  overflow:hidden;

  /* 🌈 pastel anime gradient */
  background:linear-gradient(135deg,#bcdcff,#ffd6e7,#e6dcff);
}

/* ✨ LAYER 1 (white glow) */
body::before{
  content:"";
  position:absolute;
  width:320px;
  height:320px;
  background:#ffffff;
  opacity:0.25;
  filter:blur(90px);
  border-radius:50%;
  top:10%;
  left:10%;
}

/* ✨ LAYER 2 (pink glow) */
body::after{
  content:"";
  position:absolute;
  width:350px;
  height:350px;
  background:#ffb6d9;
  opacity:0.25;
  filter:blur(100px);
  border-radius:50%;
  bottom:10%;
  right:10%;
}

.card{
  text-align:center;
  max-width:320px;
  padding:22px;

  /* 🧊 glass effect */
  background:rgba(255,255,255,0.7);
  backdrop-filter: blur(12px);
  border-radius:18px;
  box-shadow:0 10px 30px rgba(0,0,0,0.08);

  z-index:1;
}

h1{
  color:#2c3e50;
  font-size:22px;
}

p{
  color:#555;
  font-size:13px;
  line-height:1.6;
}

button{
  margin-top:12px;
  padding:10px 18px;
  border:none;
  border-radius:10px;
  background:#4a6fa5;
  color:white;
  cursor:pointer;
  transition:0.2s;
}

button:hover{
  transform:scale(1.05);
}
</style>
</head>

<body>

<div class="card">
  <h1>Dear, Girletterz 💌</h1>

  <p>
    Mungkin aku nggak selalu punya jawaban yang “sempurna”,  
    tapi aku bakal selalu berusaha buat ngerti perasaan kamu.  
  </p>

  <p>🍃 tempat cerita tanpa di-judge 🍃</p>

  <button onclick="location.href='curhat.html'">masuk</button>
</div>

</body>
</html>
