<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Dashboard Girletterz 🗳</title>

<style>
body{
  margin:0;
  font-family:Arial;
  min-height:100vh;
  padding:20px;
  overflow-x:hidden;

  background:linear-gradient(135deg,#cfe8ff,#e8f0ff,#f5f7ff);
}

/* 🌫 glow */
body::before, body::after{
  content:"";
  position:fixed;
  width:420px;
  height:420px;
  border-radius:50%;
  filter:blur(140px);
  opacity:0.28;
  z-index:0;
}

body::before{
  background:#ffffff;
  top:-100px;
  left:-100px;
}

body::after{
  background:#a9c9ff;
  bottom:-120px;
  right:-120px;
}

/* 🌐 NAV */
.nav{
  position:fixed;
  top:12px;
  left:50%;
  transform:translateX(-50%);
  background:rgba(255,255,255,0.6);
  backdrop-filter:blur(14px);
  padding:8px 14px;
  border-radius:14px;
  display:flex;
  gap:18px;
  font-size:14px;
  box-shadow:0 8px 25px rgba(0,0,0,0.08);
  z-index:999;
}

.nav a{
  text-decoration:none;
  color:#2c3e50;
}

.nav a:hover{
  color:#5f88c7;
}

/* TITLE */
h2{
  text-align:center;
  margin-top:80px;
  color:#2c3e50;
  position:relative;
  z-index:1;
}

/* 🧊 CARD */
.card{
  background:rgba(255,255,255,0.72);
  backdrop-filter:blur(16px);
  padding:16px;
  margin:12px auto;
  width:92%;
  max-width:520px;
  border-radius:18px;
  box-shadow:0 10px 30px rgba(0,0,0,0.08);
  position:relative;
  z-index:1;

  transition:0.2s;
}

.card:hover{
  transform:translateY(-2px);
}

/* TEXTAREA */
textarea{
  width:100%;
  height:70px;
  margin-top:8px;
  border-radius:10px;
  border:1px solid #d6e6ff;
  padding:10px;
  background:rgba(255,255,255,0.8);
  outline:none;
}

/* BUTTON */
button{
  margin-top:8px;
  padding:10px 14px;
  border:none;
  background:#5f88c7;
  color:white;
  border-radius:10px;
  cursor:pointer;
  transition:0.2s;
}

button:hover{
  transform:scale(1.05);
}

/* SMALL TEXT */
small{
  color:#666;
}

/* LOADING */
#loading{
  text-align:center;
  margin-top:20px;
  color:#5f88c7;
  z-index:1;
  position:relative;
}
</style>
</head>

<body>

<!-- 🌐 NAV -->
<div class="nav">
  <a href="index.html">🏠 Home</a>
  <a href="curhat.html">💌 Curhat</a>
  <a href="cek.html">💬 Cek</a>
  <a href="login.html">🔐 Login</a>
</div>

<h2>🗳 Girletterz Dashboard</h2>

<div id="loading">loading curhat... 💙</div>
<div id="list"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getFirestore,
  collection,
  getDocs,
  doc,
  updateDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

import {
  getAuth,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyDzPenfYo2",
  authDomain: "dear-girletterz-a2c37.firebaseapp.com",
  projectId: "dear-girletterz-a2c37"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

const list = document.getElementById("list");
const loading = document.getElementById("loading");

/* 🔐 LOGIN PROTECTION */
onAuthStateChanged(auth, (user) => {
  if(!user){
    window.location.href = "login.html";
  } else {
    loadData();
  }
});

async function loadData(){
  loading.style.display = "block";

  const snap = await getDocs(collection(db,"curhat"));

  list.innerHTML = "";

  snap.forEach((d)=>{
    let data = d.data();

    let div = document.createElement("div");
    div.className = "card";

    div.innerHTML = `
      <b>💌 Kode:</b> ${d.id}<br><br>

      <b>Curhat:</b><br>
      ${data.isi}<br><br>

      <small>💬 Balasan:</small>
      <textarea id="b-${d.id}">${data.balasan || ""}</textarea>

      <button onclick="kirimBalasan('${d.id}')">kirim balasan</button>
    `;

    list.appendChild(div);
  });

  loading.style.display = "none";
}

window.kirimBalasan = async function(id){
  let isi = document.getElementById("b-"+id).value;

  await updateDoc(doc(db,"curhat",id),{
    balasan: isi
  });

  alert("balasan terkirim 💙");
}
</script>

</body>
</html>
