<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Cek Balasan 🪧</title>

<style>
body{
  margin:0;
  font-family:Arial;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  overflow:hidden;

  background:linear-gradient(135deg,#cfe8ff,#e8f0ff,#f5f7ff);
}

/* 🌊 glow layer */
body::before, body::after{
  content:"";
  position:fixed;
  width:420px;
  height:420px;
  border-radius:50%;
  filter:blur(140px);
  opacity:0.28;
  z-index:0;
}

body::before{
  background:#ffffff;
  top:-100px;
  left:-100px;
}

body::after{
  background:#a9c9ff;
  bottom:-120px;
  right:-120px;
}

/* 🌐 NAV */
.nav{
  position:fixed;
  top:12px;
  left:50%;
  transform:translateX(-50%);
  background:rgba(255,255,255,0.6);
  backdrop-filter:blur(14px);
  padding:8px 14px;
  border-radius:14px;
  display:flex;
  gap:18px;
  font-size:14px;
  box-shadow:0 8px 25px rgba(0,0,0,0.08);
  z-index:999;
}

.nav a{
  text-decoration:none;
  color:#2c3e50;
}

.nav a:hover{
  color:#5f88c7;
}

/* 💙 CARD */
.card{
  background:rgba(255,255,255,0.72);
  backdrop-filter:blur(16px);
  padding:25px;
  border-radius:18px;
  width:340px;
  text-align:center;
  box-shadow:0 10px 30px rgba(0,0,0,0.08);
  z-index:1;
  position:relative;
}

/* INPUT */
input{
  width:100%;
  padding:10px;
  border-radius:10px;
  border:1px solid #d6e6ff;
  outline:none;
  background:rgba(255,255,255,0.85);
}

/* BUTTON */
button{
  margin-top:10px;
  padding:10px;
  width:100%;
  border:none;
  border-radius:10px;
  background:#5f88c7;
  color:white;
  cursor:pointer;
  transition:0.2s;
}

button:hover{
  transform:scale(1.05);
}

/* 💌 RESULT */
.result{
  margin-top:15px;
  text-align:left;
  font-size:13px;
  color:#2c3e50;
  line-height:1.5;
}

/* 📦 BOX */
.box{
  margin-top:8px;
  padding:10px;
  border-radius:12px;
  background:rgba(255,255,255,0.75);
  backdrop-filter:blur(10px);
  border:1px solid rgba(95,136,199,0.2);
}

/* TITLE */
h3{
  color:#2c3e50;
  margin-bottom:10px;
}
</style>
</head>

<body>

<!-- 🌐 NAV -->
<div class="nav">
  <a href="index.html">🏠 Home</a>
  <a href="curhat.html">💌 Curhat</a>
  <a href="cek.html">💬 Cek</a>
  <a href="dashboard.html">🧑‍💻 Admin</a>
</div>

<!-- 💙 CARD -->
<div class="card">
  <h3>💬 Cek Balasan</h3>

  <input id="kode" placeholder="masukkan kode GLTZ">
  <button onclick="cek()">lihat</button>

  <div id="hasil" class="result"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDzPenfYo",
  authDomain: "dear-girletterz-a2c37.firebaseapp.com",
  projectId: "dear-girletterz-a2c37"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

window.cek = async function(){
  let kode = document.getElementById("kode").value;

  const snap = await getDoc(doc(db,"curhat",kode));

  if(!snap.exists()){
    document.getElementById("hasil").innerHTML = "❌ kode tidak ditemukan";
    return;
  }

  let d = snap.data();

  document.getElementById("hasil").innerHTML = `
    💌 Curhat:
    <div class="box">${d.isi}</div>

    💬 Balasan:
    <div class="box">${d.balasan || "belum ada balasan"}</div>
  `;
}
</script>

</body>
</html>
