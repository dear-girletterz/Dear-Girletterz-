<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Login Admin 🔐</title>

<style>
body{
  margin:0;
  font-family:Arial;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  overflow:hidden;

  background:linear-gradient(135deg,#cfe8ff,#e8f0ff,#f5f7ff);
}

/* 🌊 glow layer */
body::before{
  content:"";
  position:fixed;
  width:450px;
  height:450px;
  background:#ffffff;
  opacity:0.35;
  filter:blur(130px);
  border-radius:50%;
  top:-80px;
  left:-80px;
}

body::after{
  content:"";
  position:fixed;
  width:500px;
  height:500px;
  background:#a9c9ff;
  opacity:0.25;
  filter:blur(140px);
  border-radius:50%;
  bottom:-100px;
  right:-100px;
}

/* 💙 CARD */
.card{
  background:rgba(255,255,255,0.72);
  backdrop-filter:blur(16px);
  padding:25px;
  border-radius:18px;
  width:300px;
  text-align:center;
  box-shadow:0 10px 30px rgba(0,0,0,0.08);
  z-index:1;
}

h3{
  color:#2c3e50;
}

input{
  width:100%;
  padding:10px;
  margin:8px 0;
  border-radius:10px;
  border:1px solid #ddd;
  outline:none;
}

button{
  width:100%;
  padding:10px;
  border:none;
  border-radius:10px;
  background:#5f88c7;
  color:white;
  cursor:pointer;
  transition:0.2s;
}

button:hover{
  transform:scale(1.05);
}

small{
  color:#666;
}
</style>
</head>

<body>

<div class="card">
  <h3>🔐 Admin Login</h3>
  <small>Girletterz Dashboard</small>

  <input id="email" placeholder="email admin">
  <input id="pass" type="password" placeholder="password">

  <button onclick="login()">masuk</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInWithEmailAndPassword } 
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyDzPenfYo2c7Q6UNin895TuZhuCj4qWE0k",
  authDomain: "dear-girletterz-a2c37.firebaseapp.com",
  projectId: "dear-girletterz-a2c37",
  appId: "1:1023676296781:web:c31b2ddfe4ce1675c9f604"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

window.login = async function(){
  let email = document.getElementById("email").value;
  let pass = document.getElementById("pass").value;

  try{
    await signInWithEmailAndPassword(auth, email, pass);

    alert("login sukses 💙");
    window.location.href = "dashboard.html";

  }catch(e){
    alert("login gagal ❌ cek email/password atau Firebase Auth belum aktif");
  }
}
</script>

</body>
</html>
