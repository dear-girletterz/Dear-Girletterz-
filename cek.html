<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Cek Balasan 🪧</title>

<style>
body{
  margin:0;
  font-family:Arial;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  overflow:hidden;

  background:linear-gradient(135deg,#bcdcff,#ffd6e7,#e6dcff);
}

/* ✨ LAYER GLOW */
body::before{
  content:"";
  position:absolute;
  width:320px;
  height:320px;
  background:#ffffff;
  opacity:0.25;
  filter:blur(90px);
  border-radius:50%;
  top:10%;
  left:10%;
}

body::after{
  content:"";
  position:absolute;
  width:350px;
  height:350px;
  background:#ffb6d9;
  opacity:0.25;
  filter:blur(100px);
  border-radius:50%;
  bottom:10%;
  right:10%;
}

/* 🌐 NAVBAR GLASS */
.nav{
  position:fixed;
  top:12px;
  left:50%;
  transform:translateX(-50%);
  background:rgba(255,255,255,0.6);
  backdrop-filter: blur(12px);
  padding:8px 14px;
  border-radius:14px;
  display:flex;
  gap:18px;
  box-shadow:0 8px 20px rgba(0,0,0,0.08);
  font-size:14px;
  z-index:999;
}

.nav a{
  text-decoration:none;
  color:#2c3e50;
}

.nav a:hover{
  color:#4a6fa5;
}

/* 💌 CARD GLASS */
.card{
  background:rgba(255,255,255,0.7);
  backdrop-filter: blur(12px);
  padding:25px;
  border-radius:18px;
  width:340px;
  text-align:center;
  box-shadow:0 10px 30px rgba(0,0,0,0.08);
  z-index:1;
}

input{
  width:100%;
  padding:10px;
  border-radius:10px;
  border:1px solid #ddd;
  outline:none;
  background:rgba(255,255,255,0.8);
}

button{
  margin-top:10px;
  padding:10px;
  border:none;
  border-radius:10px;
  background:#4a6fa5;
  color:white;
  cursor:pointer;
  transition:0.2s;
}

button:hover{
  transform:scale(1.05);
}

/* 💖 RESULT BOX */
.result{
  margin-top:15px;
  font-size:13px;
  text-align:left;
  line-height:1.6;
  color:#333;
}

.box{
  margin-top:10px;
  padding:10px;
  border-radius:12px;
  background:rgba(255,255,255,0.7);
  backdrop-filter: blur(8px);
}
</style>
</head>

<body>

<!-- 🌐 NAVBAR -->
<div class="nav">
  <a href="index.html">🏠 Home</a>
  <a href="curhat.html">💌 Curhat</a>
  <a href="cek.html">💬 Cek</a>
  <a href="dashboard.html">🧑‍💻 Admin</a>
</div>

<!-- 💌 CARD -->
<div class="card">
  <h3>💬 Cek Balasan</h3>

  <input id="kode" placeholder="masukkan kode GLTZ">

  <button onclick="cek()">lihat</button>

  <div id="hasil" class="result"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDzPenfYo2",
  authDomain: "dear-girletterz-a2c37.firebaseapp.com",
  projectId: "dear-girletterz-a2c37"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

window.cek = async function(){
  let kode = document.getElementById("kode").value;

  const snap = await getDoc(doc(db,"curhat",kode));

  if(!snap.exists()){
    document.getElementById("hasil").innerHTML="❌ kode tidak ditemukan";
    return;
  }

  let d = snap.data();

  document.getElementById("hasil").innerHTML = `
    💌 <b>Curhat:</b>
    <div class="box">${d.isi}</div>

    💬 <b>Balasan:</b>
    <div class="box">${d.balasan || "belum ada balasan"}</div>
  `;
}
</script>

</body>
</html>
