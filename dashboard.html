<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Dashboard Girletterz 🗳</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background: linear-gradient(135deg,#eaf2ff,#f7f7fb,#ffeef3);
  min-height:100vh;
  padding:20px;
}

/* 🌐 NAVBAR */
.nav{
  position:fixed;
  top:12px;
  left:50%;
  transform:translateX(-50%);
  background:rgba(255,255,255,0.7);
  backdrop-filter: blur(10px);
  padding:8px 14px;
  border-radius:14px;
  display:flex;
  gap:18px;
  box-shadow:0 8px 20px rgba(0,0,0,0.08);
  font-size:14px;
  z-index:999;
}

.nav a{
  text-decoration:none;
  color:#2c3e50;
}

.nav a:hover{
  color:#4a6fa5;
}

h2{
  text-align:center;
  color:#2c3e50;
  margin-top:70px;
}

.card{
  background:white;
  padding:15px;
  margin:10px auto;
  width:90%;
  max-width:500px;
  border-radius:12px;
  box-shadow:0 5px 15px rgba(0,0,0,0.08);
}

textarea{
  width:100%;
  height:60px;
  margin-top:8px;
  border-radius:8px;
  border:1px solid #ddd;
  padding:8px;
  outline:none;
}

button{
  margin-top:5px;
  padding:8px 12px;
  border:none;
  background:#4a6fa5;
  color:white;
  border-radius:8px;
  cursor:pointer;
  transition:0.2s;
}

button:hover{
  transform:scale(1.03);
}
</style>
</head>

<body>

<!-- 🌐 NAVBAR -->
<div class="nav">
  <a href="index.html">🏠 Home</a>
  <a href="curhat.html">💌 Curhat</a>
  <a href="cek.html">💬 Cek</a>
  <a href="dashboard.html">🧑‍💻 Admin</a>
</div>

<h2>🗳 Dashboard Girletterz</h2>

<div id="list"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getFirestore,
  collection,
  getDocs,
  doc,
  updateDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDzPenfYo2c7Q6UNin895TuZhuCj4qWE0k",
  authDomain: "dear-girletterz-a2c37.firebaseapp.com",
  projectId: "dear-girletterz-a2c37",
  storageBucket: "dear-girletterz-a2c7.firebasestorage.app",
  messagingSenderId: "1023676296781",
  appId: "1:1023676296781:web:c31b2ddfe4ce1675c9f604"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const list = document.getElementById("list");

async function loadData(){
  const snap = await getDocs(collection(db,"curhat"));

  list.innerHTML = "";

  snap.forEach((d)=>{
    let data = d.data();

    let div = document.createElement("div");
    div.className = "card";

    div.innerHTML = `
      <b>Kode:</b> ${d.id}<br><br>
      <b>Curhat:</b><br>
      ${data.isi}<br><br>

      <small>Balasan:</small><br>
      <textarea id="b-${d.id}">${data.balasan || ""}</textarea>
      <br>
      <button onclick="kirimBalasan('${d.id}')">kirim balasan</button>
    `;

    list.appendChild(div);
  });
}

window.kirimBalasan = async function(id){
  let isi = document.getElementById("b-"+id).value;

  await updateDoc(doc(db,"curhat",id),{
    balasan: isi
  });

  alert("balasan terkirim 💖");
}

loadData();
</script>

</body>
</html>
