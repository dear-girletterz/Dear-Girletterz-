<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Dashboard Girletterz 🗳</title>

<style>
body{
  margin:0;
  font-family:Arial;
  min-height:100vh;
  padding:20px;
  overflow-x:hidden;

  background:linear-gradient(135deg,#bcdcff,#ffd6e7,#e6dcff);
}

/* ✨ GLOW */
body::before{
  content:"";
  position:fixed;
  width:320px;
  height:320px;
  background:#ffffff;
  opacity:0.25;
  filter:blur(90px);
  border-radius:50%;
  top:10%;
  left:10%;
}

body::after{
  content:"";
  position:fixed;
  width:350px;
  height:350px;
  background:#ffb6d9;
  opacity:0.25;
  filter:blur(100px);
  border-radius:50%;
  bottom:10%;
  right:10%;
}

/* 🌐 NAV */
.nav{
  position:fixed;
  top:12px;
  left:50%;
  transform:translateX(-50%);
  background:rgba(255,255,255,0.6);
  backdrop-filter: blur(12px);
  padding:8px 14px;
  border-radius:14px;
  display:flex;
  gap:18px;
  box-shadow:0 8px 20px rgba(0,0,0,0.08);
  font-size:14px;
  z-index:999;
}

.nav a{
  text-decoration:none;
  color:#2c3e50;
}

.nav a:hover{
  color:#4a6fa5;
}

h2{
  text-align:center;
  color:#2c3e50;
  margin-top:80px;
  position:relative;
  z-index:1;
}

/* 💌 CARD */
.card{
  background:rgba(255,255,255,0.7);
  backdrop-filter: blur(12px);
  padding:15px;
  margin:10px auto;
  width:90%;
  max-width:500px;
  border-radius:18px;
  box-shadow:0 10px 25px rgba(0,0,0,0.08);
  position:relative;
  z-index:1;
}

textarea{
  width:100%;
  height:60px;
  margin-top:8px;
  border-radius:10px;
  border:1px solid #ddd;
  padding:8px;
  background:rgba(255,255,255,0.8);
}

button{
  margin-top:5px;
  padding:8px 12px;
  border:none;
  background:#4a6fa5;
  color:white;
  border-radius:10px;
  cursor:pointer;
  transition:0.2s;
}

button:hover{
  transform:scale(1.05);
}
</style>
</head>

<body>

<!-- 🌐 NAV -->
<div class="nav">
  <a href="index.html">🏠 Home</a>
  <a href="curhat.html">💌 Curhat</a>
  <a href="cek.html">💬 Cek</a>
  <a href="login.html">🔐 Login</a>
</div>

<h2>🗳 Dashboard Girletterz</h2>

<div id="list"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getFirestore,
  collection,
  getDocs,
  doc,
  updateDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

import {
  getAuth,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyDzPenfYo2",
  authDomain: "dear-girletterz-a2c37.firebaseapp.com",
  projectId: "dear-girletterz-a2c37"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

const list = document.getElementById("list");

/* 🔐 PROTECTION LOGIN */
onAuthStateChanged(auth, (user) => {
  if(!user){
    alert("harus login dulu 🔐");
    window.location.href = "login.html";
  } else {
    loadData();
  }
});

async function loadData(){
  const snap = await getDocs(collection(db,"curhat"));

  list.innerHTML = "";

  snap.forEach((d)=>{
    let data = d.data();

    let div = document.createElement("div");
    div.className = "card";

    div.innerHTML = `
      <b>💌 Kode:</b> ${d.id}<br><br>
      <b>Curhat:</b><br>
      ${data.isi}<br><br>

      <small>💬 Balasan:</small><br>
      <textarea id="b-${d.id}">${data.balasan || ""}</textarea>
      <br>
      <button onclick="kirimBalasan('${d.id}')">kirim balasan</button>
    `;

    list.appendChild(div);
  });
}

window.kirimBalasan = async function(id){
  let isi = document.getElementById("b-"+id).value;

  await updateDoc(doc(db,"curhat",id),{
    balasan: isi
  });

  alert("balasan terkirim 💖");
}
</script>

</body>
</html>
